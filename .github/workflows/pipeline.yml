name: Pipeline CI/CD

on:
  push:
    branches: [ main, develop, 'feature/**', 'release/**', 'hotfix/**' ]
  pull_request:
    branches: [ main, develop ]

# Variáveis da pipeline (slides 102-105)
env:
  NOME_PROJETO: "Projeto Pipeline CI/CD"
  PORTA: "8080"

jobs:
  # ---------- STAGE 1: BUILD ----------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Verificar arquivos do projeto
        run: |
          echo "Construindo o $NOME_PROJETO"
          test -f index.html
          test -f server.py
          python3 -m py_compile server.py
          echo "Build OK"

  # ---------- STAGE 2: TESTES (2 jobs em paralelo - slides 90-93) ----------
  teste-pagina:
    name: Teste - Página
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Verificar conteúdo do index.html
        run: |
          grep -q "<h1>" index.html
          echo "Página OK"

  teste-servidor:
    name: Teste - Servidor
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Subir a aplicação e testar
        run: |
          python3 server.py &
          sleep 3
          curl -f http://localhost:$PORTA
          echo "Aplicação respondendo na porta $PORTA"

  # ---------- STAGE 3: DEPLOY (só roda se tudo passar - slides 94-101) ----------
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [teste-pagina, teste-servidor]
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "Deploy do $NOME_PROJETO realizado com sucesso!"
