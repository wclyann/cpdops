name: Pipeline CI/CD

on:
  push:
    branches: [ main, develop, 'feature/**', 'release/**', 'hotfix/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:   

permissions:
  contents: read
  security-events: write


env:
  NOME_PROJETO: "Projeto Pipeline CI/CD"
  PORTA: "8080"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verificar arquivos do projeto
        run: |
          echo "Construindo o $NOME_PROJETO"
          test -f index.html
          test -f server.py
          python3 -m py_compile server.py
          echo "Build OK"

  
  teste-pagina:
    name: Teste - Página
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verificar conteúdo do index.html
        run: |
          grep -q "<h1>" index.html
          echo "Página OK"

  teste-servidor:
    name: Teste - Servidor
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Subir a aplicação e testar
        run: |
          python3 server.py &
          sleep 3
          curl -f http://localhost:$PORTA
          echo "Aplicação respondendo na porta $PORTA"

  # SAST 
  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    needs: [teste-pagina, teste-servidor]
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Rodar Semgrep (falha se achar vulnerabilidade)
        run: semgrep scan --config auto --error --sarif-output=semgrep.sarif

      - name: Enviar resultado para a aba Security
        if: always()
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3
        with:
          sarif_file: semgrep.sarif

      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: relatorio-semgrep
          path: semgrep.sarif

  # DAST
  dast:
    name: DAST - OWASP ZAP
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Subir aplicação
        run: |
          python3 server.py &
          for i in $(seq 1 15); do
            curl -s http://localhost:$PORTA > /dev/null && break
            sleep 2
          done

      
      - name: Regras do ZAP
        run: |
          mkdir -p .zap
          printf '10049\tIGNORE\t(Non-Storable Content: informativo, no-store e intencional)\n' > .zap/rules.tsv
          printf '90005\tIGNORE\t(Sec-Fetch-Dest: cabecalho enviado pelo navegador, nao pelo servidor)\n' >> .zap/rules.tsv
          cat .zap/rules.tsv

      - name: ZAP Baseline Scan (falha se achar alerta)
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: 'http://localhost:8080'
          rules_file_name: '.zap/rules.tsv'
          fail_action: true
          allow_issue_writing: false
          cmd_options: '-a'
          artifact_name: relatorio-zap

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [sast, dast]
    if: github.ref == 'refs/heads/main'
    steps:
      - run: echo "Deploy do $NOME_PROJETO realizado com sucesso!"
